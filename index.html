<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dividend Tracker"><link rel="manifest" href="manifest.json"><title>Dividend Tracker</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6b7280;--line:#e5e7eb;--good:#16803c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:80px}header{padding:20px 16px 12px;position:sticky;top:0;background:#f5f5f7ee;backdrop-filter:blur(18px);z-index:2;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:14px;margin-top:3px}.wrap{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.label{font-size:13px;color:var(--muted)}.big{font-size:28px;font-weight:700;margin-top:5px}.small{font-size:13px;color:var(--muted);margin-top:4px}.section{font-size:19px;font-weight:700;margin:22px 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.bar{height:9px;background:#e8e8eb;border-radius:9px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:#111}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit}button.primary{background:#111;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:600}button.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}nav{position:fixed;bottom:0;left:0;right:0;background:#fffef5;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3}nav button{flex:1;max-width:150px;border:0;background:transparent;color:#777;padding:10px 3px}nav button.active{color:#111;font-weight:700}nav small{display:block;margin-top:3px}dialog{border:0;border-radius:20px;width:min(94vw,520px);padding:0}dialog::backdrop{background:#0007}.modal{padding:20px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#fff}.empty{text-align:center;color:var(--muted);padding:24px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="wrap"><h1>Dividend Tracker</h1><div class="sub">Personal income & contribution dashboard</div></div></header>
<main class="wrap"><div id="content"></div></main><nav id="nav"></nav>
<dialog id="dlg"><div class="modal"><h2>Add transaction</h2><form id="form"><label>Date</label><input id="date" type="date" required><label>Type</label><select id="type"><option value="contribution">Contribution / buy</option><option value="dividend">Dividend received</option><option value="cash">Cash interest</option></select><label>Holding</label><select id="holding"></select><label>Amount (€)</label><input id="amount" type="number" min="0" step=".01" required><label>Shares (optional)</label><input id="shares" type="number" min="0" step=".0001"><label>Note</label><input id="note"><div class="actions" style="margin-top:18px"><button class="primary">Save</button><button type="button" class="secondary" onclick="dlg.close()">Cancel</button></div></form></div></dialog>
<script>
var seed=[{name:"JEQP",shares:0,annual:0,active:true},{name:"VGWD",shares:0,annual:0,active:true},{name:"VGWL",shares:0,annual:0,active:true},{name:"VEUR",shares:0,annual:0,active:true},{name:"VHYL",shares:0,annual:0,active:false},{name:"JGPI",shares:0,annual:0,active:true},{name:"SCHD",shares:0,annual:0,active:true},{name:"MO",shares:0,annual:0,active:false}];
var holdings=JSON.parse(localStorage.getItem("dt_holdings")||"null")||seed;
var tx=JSON.parse(localStorage.getItem("dt_tx")||"[]");
var cash=Number(localStorage.getItem("dt_cash")||0);
var salary=Number(localStorage.getItem("dt_salary")||0);
var target=Number(localStorage.getItem("dt_target")||200);
var tab=localStorage.getItem("dt_tab")||"dashboard";
function money(n){return "€"+Number(n||0).toLocaleString("en-IE",{minimumFractionDigits:2,maximumFractionDigits:2})}
function annual(){return holdings.reduce(function(a,h){return a+Number(h.annual||0)},0)}
function save(){localStorage.setItem("dt_holdings",JSON.stringify(holdings));localStorage.setItem("dt_tx",JSON.stringify(tx));localStorage.setItem("dt_cash",cash);localStorage.setItem("dt_salary",salary);localStorage.setItem("dt_target",target);localStorage.setItem("dt_tab",tab)}
function setTab(x){tab=x;save();render()}
function nav(){var a=["dashboard","holdings","activity","income","goals","settings"],icons=["⌂","◉","☷","◷","◎","⚙"],html="";for(var i=0;i<a.length;i++){html+='<button class="'+(tab===a[i]?"active":"")+'" onclick="setTab(\''+a[i]+'\')">'+icons[i]+'<small>'+a[i][0].toUpperCase()+a[i].slice(1)+'</small></button>'}document.getElementById("nav").innerHTML=html}
function dashboard(){var a=annual(),j=holdings.find(function(h){return h.name==="JEQP"}),stress=a-(j?j.annual*.2:0),m=stress/12+cash,p=Math.min(100,m/target*100);return '<div class="grid"><div class="card"><div class="label">Monthly passive income</div><div class="big">'+money(m)+'</div><div class="small">20% JEQP distribution stress</div></div><div class="card"><div class="label">Annualized</div><div class="big">'+money(m*12)+'</div><div class="small">Current run-rate</div></div><div class="card"><div class="label">ETF income / month</div><div class="big">'+money(stress/12)+'</div><div class="small">Stress-adjusted</div></div><div class="card"><div class="label">Cash interest</div><div class="big">'+money(cash)+'</div><div class="small">Manual assumption</div></div></div><div class="section">2027 income target</div><div class="card"><div><b>'+money(m)+'</b> of <b>'+money(target)+'</b> / month</div><div class="bar"><span style="width:'+p+'%"></span></div><div class="small">Gap: '+money(Math.max(0,target-m))+'/month</div></div><div class="section">Strategy</div><div class="card"><div class="row"><span>Salary contributions</span><b>'+money(salary)+'/month</b></div><div class="row"><span>Dividends</span><b>100% reinvested → JEQP</b></div><div class="row"><span>Cash income</span><b>'+money(cash)+'/month</b></div></div><div class="section">Annual income by holding</div><div class="card">'+holdings.map(function(h){return '<div class="row"><b>'+h.name+'</b><span>'+money(h.annual)+'</span></div>'}).join("")+'</div><button class="primary" style="margin-top:14px" onclick="openDlg()">+ Add transaction</button>'}
function holdingsView(){return '<div class="actions"><button class="primary" onclick="openDlg()">+ Transaction</button></div><div class="section">Holdings</div><div class="card">'+holdings.map(function(h){return '<div class="row"><div><b>'+h.name+'</b><div class="small">'+h.shares+' shares · '+(h.active?"active contributions":"held only")+'</div></div><div><b>'+money(h.annual)+'</b><div class="small">'+money(h.annual/12)+'/mo</div></div></div>'}).join("")+'</div>'}
function activity(){var rows=tx.slice().reverse().map(function(t){return '<tr><td>'+t.date+'</td><td>'+t.type+'</td><td>'+t.holding+'</td><td>'+money(t.amount)+'</td></tr>'}).join("");return '<div class="actions"><button class="primary" onclick="openDlg()">+ Add transaction</button><button class="secondary" onclick="exportData()">Export JSON</button></div><div class="section">Activity</div><div class="card">'+(rows?'<table><tr><th>Date</th><th>Type</th><th>Holding</th><th>Amount</th></tr>'+rows+'</table>':'<div class="empty">No transactions yet.</div>')+'</div>'}
function income(){var ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],s=Array(12).fill(0);tx.forEach(function(t){if(t.type==="dividend"||t.type==="cash"){s[new Date(t.date).getMonth()]+=Number(t.amount)}});return '<div class="section">Income received</div><div class="grid"><div class="card"><div class="label">Tracked income</div><div class="big">'+money(s.reduce(function(a,b){return a+b},0))+'</div></div><div class="card"><div class="label">Projected monthly</div><div class="big">'+money(annual()/12+cash)+'</div></div></div><div class="section">Monthly history</div><div class="card">'+ms.map(function(m,i){return '<div class="row"><span>'+m+'</span><b>'+money(s[i])+'</b></div>'}).join("")+'</div>'}
function goals(){var current=annual()/12+cash;return '<div class="section">Income goal</div><div class="card"><div class="label">Monthly target</div><div class="big">'+money(target)+'</div><label>Change target</label><input type="number" value="'+target+'" step="10" onchange="target=Number(this.value);save();render()"><div class="section">Current run-rate</div><div class="big">'+money(current)+'</div><div class="small">Includes your configured monthly cash income.</div><div class="section">JEQP 20% stress test</div><div class="small">A 20% reduction in the current JEQP annual distribution removes '+money((holdings.find(function(h){return h.name==="JEQP"})||{annual:0}).annual*.2)+'/year, or '+money((holdings.find(function(h){return h.name==="JEQP"})||{annual:0}).annual*.2/12)+'/month, assuming the share count stays unchanged.</div></div>'}
function settings(){return '<div class="section">Settings</div><div class="card"><label>Monthly salary contribution</label><input type="number" value="'+salary+'" onchange="salary=Number(this.value);save()"><label>Monthly cash interest</label><input type="number" value="'+cash+'" onchange="cash=Number(this.value);save()"><div class="actions" style="margin-top:18px"><button class="secondary" onclick="exportData()">Export JSON</button><button class="secondary" onclick="resetData()">Reset local data</button></div><p class="small">Transactions and settings are stored locally on this device/browser. GitHub stores the application code, not your private transaction data.</p></div>'}
function render(){nav();var f={dashboard:dashboard,holdings:holdingsView,activity:activity,income:income,goals:goals,settings:settings};document.getElementById("content").innerHTML=f[tab]()}
function openDlg(){document.getElementById("date").value=new Date().toISOString().slice(0,10);document.getElementById("holding").innerHTML=holdings.map(function(h){return "<option>"+h.name+"</option>"}).join("");document.getElementById("dlg").showModal()}
document.getElementById("form").addEventListener("submit",function(e){e.preventDefault();var t={date:date.value,type:type.value,holding:holding.value,amount:Number(amount.value),shares:Number(shares.value||0),note:note.value};tx.push(t);if(t.type==="contribution"){var h=holdings.find(function(x){return x.name===t.holding});if(h&&t.shares)h.shares+=t.shares}save();dlg.close();render()});
function exportData(){var b=new Blob([JSON.stringify({holdings:holdings,tx:tx,cash:cash,salary:salary,target:target},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dividend-tracker-backup.json";a.click()}
function resetData(){if(confirm("Reset all local tracker data?")){localStorage.clear();location.reload()}}
render();if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js").catch(function(){});
</script></body></html>
